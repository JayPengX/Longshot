# Deploys Longshot's Worker (worker/, longshot.pengzjay.workers.dev), then
# puts Gemini's key on it when the repo has one, on every push to main
# that touches what they run. The tests run first; a failing test deploys
# nothing.
name: Deploy Longshot Worker

on:
  push:
    branches: ['main']
    paths:
      - 'worker/**'
      - 'public/kit/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

# One deploy at a time; pushes made while one runs wait as one (the latest),
# not a queue of each. Never cancelled midway: a Worker half-deployed is worse.
concurrency:
  group: 'longshot-worker'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Until the repo has CLOUDFLARE_API_TOKEN (Shared-Proxy's longshot-bridge.yml
  # deploys meanwhile) the run skips, rather than failing on every push.
  token:
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.t.outputs.has }}
    steps:
      - id: t
        run: echo "has=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
  deploy:
    needs: token
    if: ${{ needs.token.outputs.has == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      # main as it is now, never the commit that started the run: GitHub can
      # deliver a push late, and an old tree deployed after a newer one would
      # take the live Worker back.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      # The account: the deploy token's own (one), so it needn't be a secret.
      - name: The account
        run: |
          id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result[0].id)}catch{console.log("")}})')
          [ -n "$id" ] || { echo "the token sees no account"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
      # The R2 bucket longshot-data (in Asia-Pacific): Play's board and the
      # data proxy's kept copies. Made once, then bound as DATA. (R2 has to be
      # turned on once in the dashboard; until then the Worker deploys without
      # it, /data/ answers 404 and Play builds its board itself.)
      - name: The data bucket
        continue-on-error: true
        working-directory: worker
        run: |
          if ! npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -qE 'name:\s*longshot-data$'; then npx --yes wrangler@4 r2 bucket create longshot-data --location apac; fi
          printf '\n[[r2_buckets]]\nbinding = "DATA"\nbucket_name = "longshot-data"\n' >> wrangler.toml
          echo "longshot-data bound as DATA"
      # The D1 database longshot-store: passes, wallets, slips, the token
      # secret. Made once, then bound as STORE with its id (the Worker makes
      # its own tables). The deploy token needs Account · D1 · Edit.
      - name: The store database
        working-directory: worker
        run: |
          find_id() { npx --yes wrangler@4 d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s).find(x=>x.name==="longshot-store");console.log(d?d.uuid:"")}catch{console.log("")}})'; }
          id=$(find_id)
          if [ -z "$id" ]; then npx --yes wrangler@4 d1 create longshot-store --location apac; id=$(find_id); fi
          [ -n "$id" ] || { echo "no longshot-store"; exit 1; }
          printf '\n[[d1_databases]]\nbinding = "STORE"\ndatabase_name = "longshot-store"\ndatabase_id = "%s"\n' "$id" >> wrangler.toml
          echo "longshot-store bound as STORE ($id)"
      - name: Deploy longshot
        working-directory: worker
        run: npx --yes wrangler@4 deploy
      - name: Gemini's key
        if: ${{ env.HAS_GEMINI_KEY == 'true' }}
        working-directory: worker
        run: printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
