<meta name="build-version" content="dev" />
<script>
  // Always the newest deploy: when a newer version is out than this page
  // (a browser can keep an old copy of it), reload once under a new address,
  // which fetches the page and every file fresh. Checked on open and whenever
  // the tab comes back.
  (function () {
    var mine = document.querySelector('meta[name="build-version"]').content;
    if (mine === 'dev') return;
    function check() {
      fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (latest) {
          if (!latest || !latest.version || latest.version === mine) return;
          try {
            if (sessionStorage.getItem('oddsStudy.reloadedTo') === latest.version) return;
            sessionStorage.setItem('oddsStudy.reloadedTo', latest.version);
          } catch (e) {}
          location.replace(location.pathname + '?v=' + latest.version + location.hash);
        })
        .catch(function () {});
    }
    check();
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
  })();
</script>

<header class="q-appbar">
  <div class="q-appbar-inner">
    <div class="q-brand">

      </div>
    </div>
    <nav id="tabs" class="q-tabbar" role="tablist"></nav>
    <div id="top-actions" class="q-actions"></div>
  </div>
</header>

<main class="page">
  <div id="panel-home" class="tab-panel" role="tabpanel" aria-labelledby="tab-home">

  </div>

      <nav id="league-filter" class="chips league-chips" aria-label="league" hidden></nav>
      <nav id="day-filter" class="chips" aria-label="day"></nav>
    </div>

    <section id="live" aria-labelledby="live-title" hidden>

        <h2 id="live-title" class="section-heading"></h2>
        <span id="live-updated" class="games-hint"></span>
      </div>
      <div id="live-list" class="games-grid"></div>
    </section>

    <section id="games" aria-labelledby="games-title">

      </div>

    </section>

    <section id="f1" aria-labelledby="f1-title">

      <div id="f1-body"></div>
    </section>

    <section id="futures" aria-labelledby="futures-title">

    <p id="notice" hidden></p>
  </div>

  <div id="panel-lottery" class="tab-panel" role="tabpanel" aria-labelledby="tab-lottery" hidden>

  </dialog>

    </section>
