<!doctype html>
<html lang="zh-Hant">
<head>

<meta name="application-name" content="Longshot" />
<meta name="apple-mobile-web-app-title" content="Longshot" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Longshot" />
<meta property="og:title" content="Longshot" />
<meta property="og:description" content="運彩與彩券的模擬下注，加上你真的買的運彩注單：每一注的數學都看得見。" />
<meta property="og:url" content="https://longshot.jaypengx.com/" />
<meta property="og:locale" content="zh_TW" />
<meta property="og:locale:alternate" content="en_US" />
<meta property="og:image" content="https://longshot.jaypengx.com/share/og.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Longshot" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Longshot" />
<meta name="twitter:description" content="運彩與彩券的模擬下注，加上你真的買的運彩注單：每一注的數學都看得見。" />
<meta name="twitter:image" content="https://longshot.jaypengx.com/share/og.jpg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="preconnect" href="https://longshot.pengzjay.workers.dev" crossorigin />
<link rel="preconnect" href="https://a.espncdn.com" />
<link rel="stylesheet" href="./kit/core.css" />
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./slips/slips.css" />
</head>
<body>
<div id="loading" data-title="Longshot"></div>
<script src="./kit/boot.js"></script>
<header class="q-appbar">
  <div class="q-appbar-inner">
    <div class="q-brand">
      <img class="q-brand-logo" src="./favicon.svg" alt="" width="34" height="34" />
      <div class="q-brand-text"><h1 id="title">Longshot</h1></div>
    </div>
    <nav id="tabs" class="q-tabbar" role="tablist"></nav>
    <div id="top-actions" class="q-actions"></div>
  </div>
</header>

<main class="page">
  <div id="panel-home" class="tab-panel" role="tabpanel" aria-labelledby="tab-home">
    <div id="home-body"></div>
  </div>

  <div id="panel-games" class="tab-panel" role="tabpanel" aria-labelledby="tab-games">
    <div id="day-bar" class="q-day-bar day-bar" hidden></div>
    <label class="q-search">
      <input id="game-search" type="search" autocomplete="off" enterkeyhint="search" />
      <button class="q-search-clear" type="button" aria-label="清除">✕</button>
    </label>
    <nav id="sport-filter" class="q-chips pl-chips" aria-label="sport"></nav>
    <nav id="league-filter" class="q-chips pl-chips small" aria-label="league" hidden></nav>
    <section id="live" class="q-section" hidden>
      <div class="q-section-head"><h2 class="pl-live-h" data-t="liveTitle">場中</h2><span id="live-count" class="pl-count"></span></div>
      <div id="live-list" class="q-rowcard pl-games"></div>
    </section>
    <div id="games-list"></div>
    <section id="futures" class="q-section" hidden>
      <div class="q-section-head"><h2 data-t="futuresTitle">冠軍</h2></div>
      <div id="futures-list" class="q-rowcard"></div>
    </section>
  </div>

  <div id="panel-lottery" class="tab-panel" role="tabpanel" aria-labelledby="tab-lottery" hidden>
    <div id="lottery-body"></div>
  </div>

  <div id="panel-slips" class="tab-panel sl-app" role="tabpanel" aria-labelledby="tab-slips" hidden>
    <section id="panel-open" class="sl-panel"></section>
    <section id="panel-stats" class="sl-panel" hidden></section>
  </div>

  <div id="panel-history" class="tab-panel" role="tabpanel" aria-labelledby="tab-history">
    <div id="history-tabs" class="q-seg big pl-hist-seg" role="group" hidden></div>
    <section id="saved"><div id="account-body"></div><div id="saved-body"></div></section>
    <section id="tickets" hidden><div id="tickets-body"></div></section>
    <section id="stats" hidden><div id="stats-body"></div></section>
  </div>


</main>
<script type="module" src="./app.js" onerror="window.__longshotFail()"></script>
</body>
</html>
